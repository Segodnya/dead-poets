[package]
name = "dead-poets"
version = "0.1.1"
edition = "2024"
authors = ["Kira Kurentsov <immortalsteel@gmail.com>"]
description = "Find unused (dead) gettext PO/POT keys across a polyglot codebase (PHP, Twig, JS/TS) via real AST parsing."
repository = "https://github.com/Segodnya/dead-poets"
homepage = "https://github.com/Segodnya/dead-poets"
documentation = "https://docs.rs/dead-poets"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["gettext", "i18n", "localization", "lint", "po"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dead_poets"
path = "src/lib.rs"

[[bin]]
name = "dead-poets"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Gate the CLI front-end (arg parsing, terminal rendering, logger) so library
# consumers of the classifier do not have to pull in clap / colored / env_logger.
cli = ["dep:clap", "dep:colored", "dep:env_logger", "dep:serde_json"]

[dependencies]
aho-corasick = "1.1.3"
anyhow = "1.0.102"
dashmap = "6.2.1"
globset = "0.4.18"
ignore = "0.4.25"
log = "0.4.30"
polib = "0.3.0"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
# tree-sitter family pinned exactly: grammar crates have had ABI breaks across
# releases, so we lock the validated ABI-compatible set (PLAN Addendum 2 §6).
tree-sitter = "=0.26.9"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

# CLI-only — gated behind the `cli` feature (see [features] above).
clap = { version = "4.6.1", features = ["derive"], optional = true }
colored = { version = "3.1.1", optional = true }
env_logger = { version = "0.11.10", optional = true }
serde_json = { version = "1.0.150", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
