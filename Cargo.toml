[package]
name = "dead-poets"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.3"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dashmap = "6.2.1"
env_logger = "0.11.10"
globset = "0.4.18"
ignore = "0.4.25"
log = "0.4.30"
polib = "0.3.0"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
# tree-sitter family pinned exactly: grammar crates have had ABI breaks across
# releases, so we lock the validated ABI-compatible set (PLAN Addendum 2 §6).
tree-sitter = "=0.26.9"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
